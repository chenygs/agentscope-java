server:
  port: 8080

spring:
  profiles:
    active: jdbc
  application:
    name: agentscope-builder-saton
  datasource:
    url: jdbc:h2:file:./data/builderdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: false

---
spring:
  # spring-data-redis(Lettuce)的连接配置 —— 给 sa-token-redis-template 用。
  # 这是与 Redisson 各自独立的连接通道:Redisson 自己读下面的 redisson 配置块。
  # 同一个 Redis 实例,但用不同 database 隔离,避免 sa-token 的 key 被运维误删时影响业务。
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 2
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 4
          retryDelay: !<org.redisson.config.EqualJitterDelay> {baseDelay: PT1S, maxDelay: PT2S}
          reconnectionDelay: !<org.redisson.config.EqualJitterDelay> {baseDelay: PT0.1S, maxDelay: PT10S}
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://127.0.0.1:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 1
          dnsMonitoringInterval: 5000
          dnsMonitoringTimes: 1
        password: null
        username: null
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.Kryo5Codec> {}
        transportMode: "NIO"


sa-token:
  token-name: satoken
  timeout: 604800            # 7 days
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: random-32
  is-log: false

app:
  workspace:
    root: ./data/workspaces
