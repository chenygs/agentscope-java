spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 测试用单独 database,避免与开发本地、主配的 db 1/db 2 冲突
      database: 15

sa-token:
  is-log: false

app:
  session:
    root: ${java.io.tmpdir}/agentscope-builder-saton-sessions
  workspace:
    root: ${java.io.tmpdir}/agentscope-builder-saton-workspaces
