<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPT Agent — AI 演示文稿助手</title>
    <style>
        :root {
            --bg-app: #0f172a;
            --bg-surface: #1e293b;
            --bg-hover: #334155;
            --bg-user-bubble: #1e3a5f;
            --bg-assistant-bubble: #1e293b;
            --bg-reasoning: #1a2332;
            --bg-tool: #2a2318;
            --bg-error: #2a1a1a;
            --bg-input: #1e293b;
            --bg-header-gradient: linear-gradient(135deg, #1e40af, #3b82f6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-on-header: #ffffff;
            --text-user: #f1f5f9;
            --accent: #3b82f6;
            --accent-light: #1e3a5f;
            --accent-green: #22c55e;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #818cf8;
            --border: #334155;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --header-h: 64px;
            --max-w: 900px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica,
                Arial, sans-serif;
            background: var(--bg-app);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: var(--max-w);
            margin: 0 auto;
            background: var(--bg-surface);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        @media (min-width: 940px) {
            body { padding: 20px; }
            .app { height: calc(100vh - 40px); border-radius: var(--radius-lg); }
        }

        .header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: var(--header-h);
            background: var(--bg-header-gradient);
            color: var(--text-on-header);
            position: relative;
            z-index: 10;
        }
        @media (min-width: 940px) { .header { border-radius: var(--radius-lg) var(--radius-lg) 0 0; } }

        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-logo {
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.2);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; flex-shrink: 0;
        }
        .header-title { font-size: 16px; font-weight: 600; white-space: nowrap; }
        .header-subtitle { display: none; font-size: 12px; opacity: 0.8; }
        @media (min-width: 500px) {
            .header-subtitle { display: inline; }
            .header-title-group { display: flex; align-items: baseline; gap: 8px; }
        }
        .header-status { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.85; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-green); transition: background 0.3s;
        }
        .status-dot.running { background: var(--accent-orange); animation: pulse 1.5s ease-in-out infinite; }
        .status-dot.error { background: var(--accent-red); }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }

        .messages-area {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 16px 12px; scroll-behavior: smooth;
        }
        @media (min-width: 600px) { .messages-area { padding: 20px 24px; } }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .message { display: flex; margin-bottom: 16px; animation: msgIn 0.25s ease-out; }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .message.user { justify-content: flex-end; }
        .message.assistant, .message.reasoning, .message.tool, .message.error { justify-content: flex-start; }

        .message-bubble {
            max-width: 88%; padding: 10px 14px; border-radius: var(--radius-md);
            word-break: break-word; line-height: 1.6; font-size: 14px;
        }
        @media (min-width: 600px) { .message-bubble { max-width: 78%; padding: 12px 18px; font-size: 15px; } }

        .message.user .message-bubble {
            background: var(--bg-user-bubble); color: var(--text-user);
            border-bottom-right-radius: 4px; box-shadow: var(--shadow-sm);
        }
        .message.assistant .message-bubble {
            background: var(--bg-assistant-bubble); border: 1px solid var(--border);
            border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm);
        }
        .message.reasoning .message-bubble {
            background: var(--bg-reasoning); border: 1px solid var(--border);
            border-left: 3px solid var(--accent-purple); border-radius: var(--radius-sm);
            font-size: 13px; font-style: italic; opacity: 0.85;
        }
        .message.tool .message-bubble {
            background: var(--bg-tool); border: 1px solid var(--border);
            border-left: 3px solid var(--accent-orange); border-radius: var(--radius-sm);
            font-size: 13px; font-family: monospace;
        }
        .message.error .message-bubble {
            background: var(--bg-error); border: 1px solid var(--accent-red);
            border-left: 3px solid var(--accent-red); color: var(--accent-red);
        }

        .message-role { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: var(--text-muted); }
        .message-content { white-space: pre-wrap; }
        .typing-indicator { display: flex; gap: 4px; padding: 16px 12px; align-items: center; }
        .typing-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: typingBounce 1.4s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-8px);opacity:1} }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 40px 20px; color: var(--text-muted);
        }
        .empty-state-icon {
            width: 80px; height: 80px;
            background: var(--accent-light); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; margin-bottom: 16px;
        }
        .empty-state h2 { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .empty-state p { font-size: 14px; max-width: 340px; color: var(--text-secondary); }
        .empty-state .hint { font-size: 13px; margin-top: 20px; color: var(--text-muted); }
        .empty-state .hint-item { margin: 4px 0; }

        .input-area {
            flex-shrink: 0; display: flex; gap: 8px;
            padding: 12px 12px 16px; border-top: 1px solid var(--border);
            background: var(--bg-surface); align-items: flex-end;
        }
        @media (min-width: 600px) { .input-area { padding: 16px 24px 20px; gap: 12px; } }

        .input-wrapper {
            flex: 1; display: flex; align-items: flex-end;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

        #input {
            flex: 1; padding: 10px 14px; border: none; background: transparent;
            color: var(--text-primary); font-family: inherit; font-size: 14px;
            line-height: 1.5; resize: none; outline: none;
            max-height: 120px; min-height: 24px;
        }
        @media (min-width: 600px) { #input { font-size: 15px; padding: 12px 16px; } }
        #input::placeholder { color: var(--text-muted); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 20px; border: none; border-radius: var(--radius-md);
            font-family: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            flex-shrink: 0; height: 44px;
        }
        .btn:active { transform: scale(0.96); }
        #send-btn { background: var(--accent); color: white; }
        #send-btn:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(59,130,246,0.3); filter: brightness(1.08); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #stop-btn { background: var(--accent-red); color: white; }
        #stop-btn:hover { box-shadow: 0 4px 12px rgba(239,68,68,0.3); filter: brightness(1.08); }

        .new-chat-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius-sm);
            color: var(--text-on-header); font-family: inherit; font-size: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .new-chat-btn:hover { background: rgba(255,255,255,0.25); }

        .hidden { display: none !important; }
        .message-content code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: monospace; }

        .download-bar {
            flex-shrink: 0; padding: 0 12px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        @media (min-width: 600px) { .download-bar { padding: 0 24px; } }
        .download-bar-inner {
            display: flex; align-items: center; gap: 12px;
            background: linear-gradient(135deg, #1e40af, #1e3a5f);
            border: 1px solid #3b82f6; border-radius: var(--radius-md);
            padding: 12px 16px; margin-bottom: 4px;
        }
        .download-bar-icon { font-size: 24px; flex-shrink: 0; }
        .download-bar-info { flex: 1; min-width: 0; }
        .download-bar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .download-bar-subtitle { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .download-btn {
            background: #22c55e !important; color: white !important;
            flex-shrink: 0; height: 38px; padding: 0 16px !important; font-size: 13px !important;
        }
        .download-btn:hover { filter: brightness(1.1) !important; box-shadow: 0 4px 12px rgba(34,197,94,0.3) !important; }
        .download-btn:disabled { opacity: 0.6; cursor: wait; filter: none !important; box-shadow: none !important; }
        .download-btn svg { flex-shrink: 0; }

        .btn-sm { padding: 4px 10px !important; height: 30px !important; font-size: 12px !important; border-radius: 6px !important; }
        .btn-execute { background: #22c55e !important; color: white !important; }
        .btn-execute:hover { filter: brightness(1.1) !important; }
        .btn-execute:disabled { opacity: 0.6; cursor: wait; filter: none !important; }

        .download-bar {
            flex-shrink: 0; padding: 0 12px;
            animation: slideUp 0.3s ease-out;
        }
        @media (min-width: 600px) { .download-bar { padding: 0 24px; } }
        .download-bar-inner {
            display: flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #1e40af, #1e3a5f);
            border: 1px solid #3b82f6; border-radius: var(--radius-md);
            padding: 10px 14px; margin-bottom: 4px;
        }
        .download-bar-icon { font-size: 22px; flex-shrink: 0; }
        .download-bar-info { flex: 1; min-width: 0; }
        .download-bar-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .download-bar-subtitle { font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .download-btn {
            background: #22c55e !important; color: white !important;
            flex-shrink: 0; height: 34px; padding: 0 14px !important; font-size: 13px !important;
        }
        .download-btn:hover { filter: brightness(1.1) !important; box-shadow: 0 4px 12px rgba(34,197,94,0.3) !important; }
        .download-btn:disabled { opacity: 0.6; cursor: wait; filter: none !important; box-shadow: none !important; }
        .btn-edit {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 10px; background: rgba(255,255,255,0.12); border-radius: 6px;
            color: var(--text-secondary); font-size: 12px; text-decoration: none;
            flex-shrink: 0; transition: background 0.15s;
        }
        .btn-edit:hover { background: rgba(255,255,255,0.2); color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="header">
            <div class="header-left">
                <div class="header-logo">📊</div>
                <div class="header-title-group">
                    <span class="header-title">PPT Agent</span>
                    <span class="header-subtitle">AI 演示文稿助手</span>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="/ppt-builder.html" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:8px;color:var(--text-on-header);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    PPT Builder
                </a>
                <button class="new-chat-btn" id="new-chat-btn" title="新对话">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新对话
                </button>
                <div class="header-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">就绪</span>
                </div>
            </div>
        </header>

        <div class="messages-area" id="messages">
            <div class="empty-state" id="empty-state">
                <div class="empty-state-icon">📊</div>
                <h2>PPT Agent</h2>
                <p>AI 驱动的演示文稿创作助手。告诉我主题，我帮你生成专业 PPT。</p>
                <div class="hint">
                    <div class="hint-item">💡 试试说: "帮我做一份 2026 AI 趋势的 PPT，科技风"</div>
                    <div class="hint-item">💡 试试说: "给我们的季度汇报做个商务风格的 PPT"</div>
                    <div class="hint-item">💡 试试说: "做一个产品发布的创意风格 PPT"</div>
                </div>
            </div>
        </div>

        <!-- PPT Download Bar -->
        <div class="download-bar hidden" id="download-bar">
            <div class="download-bar-inner">
                <div class="download-bar-icon">📊</div>
                <div class="download-bar-info">
                    <div class="download-bar-title">PPT 已生成</div>
                    <div class="download-bar-subtitle" id="download-bar-subtitle"></div>
                </div>
                <button class="btn download-btn" id="download-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    下载 PPT
                </button>
                <a href="/ppt-builder.html" class="btn btn-edit" title="在 PPT Builder 中编辑">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    编辑
                </a>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="input"
                    rows="1"
                    placeholder="输入你的 PPT 需求..."
                    autocomplete="off"
                    enterkeyhint="send"
                ></textarea>
            </div>
            <button class="btn" id="send-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                发送
            </button>
            <button class="btn" id="stop-btn" style="display:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                停止
            </button>
        </div>
    </div>

    <script src="/js/agui-client.js"></script>
    <script src="/js/jszip.min.js"></script>
    <script src="/js/pptxgen.min.js"></script>
    <script>
        const client = new AguiClient('/agui/run');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const messages = document.getElementById('messages');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const emptyState = document.getElementById('empty-state');
        const newChatBtn = document.getElementById('new-chat-btn');

        let threadId = 'thread-' + Date.now();
        let messageHistory = [];
        let lastAssistantContent = '';
        let isRunning = false;
        let currentAssistantDiv = null;
        let currentReasoningDiv = null;
        let reasoningContent = '';

        function setStatus(state, text) {
            statusDot.className = 'status-dot';
            if (state === 'running') statusDot.classList.add('running');
            else if (state === 'error') statusDot.classList.add('error');
            statusText.textContent = text;
        }

        function autoResize() {
            input.style.height = 'auto';
            const maxH = parseInt(getComputedStyle(input).maxHeight, 10);
            input.style.height = Math.min(input.scrollHeight, maxH) + 'px';
        }
        input.addEventListener('input', autoResize);

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function scrollToBottom() {
            requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
        }

        function createBubble(role, content) {
            const labels = { user: '你', assistant: '助手', reasoning: '推理', tool: '工具', error: '错误' };
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = '<div class="message-bubble"><div class="message-role">' + (labels[role] || role) + '</div><div class="message-content">' + escapeHtml(content) + '</div></div>';
            return div;
        }

        function appendMessage(role, content, append) {
            if (emptyState && !emptyState.classList.contains('hidden')) {
                emptyState.classList.add('hidden');
            }
            if (append && role === 'assistant' && currentAssistantDiv) {
                const el = currentAssistantDiv.querySelector('.message-content');
                el.textContent += content;
                scrollToBottom();
                return;
            }
            if (append && role === 'reasoning' && currentReasoningDiv) {
                const el = currentReasoningDiv.querySelector('.message-content');
                el.textContent += content;
                scrollToBottom();
                return;
            }
            const bubble = createBubble(role, content);
            messages.appendChild(bubble);
            scrollToBottom();
            if (role === 'assistant') currentAssistantDiv = bubble;
            else if (role === 'reasoning') currentReasoningDiv = bubble;
        }

        function showTypingIndicator() {
            hideTypingIndicator();
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'message';
            div.innerHTML = '<div class="message-bubble" style="background:transparent;border:none;padding:4px 0;"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
            messages.appendChild(div);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isRunning) return;

            input.value = '';
            autoResize();
            isRunning = true;
            sendBtn.style.display = 'none';
            stopBtn.style.display = 'inline-flex';
            setStatus('running', '生成中...');

            // Clear previous PPT data until new response confirms
            clearJsonEditor();

            appendMessage('user', text);
            messageHistory.push({ id: 'msg-' + Date.now(), role: 'user', content: text });

            showTypingIndicator();
            let assistantContent = '';
            let currentMessageId = null;

            try {
                await client.run({
                    threadId: threadId,
                    runId: 'run-' + Date.now(),
                    messages: messageHistory
                }, {
                    onRunStarted: () => {
                        currentAssistantDiv = null;
                        currentReasoningDiv = null;
                        reasoningContent = '';
                    },
                    onReasoningMessageStart: (messageId, role) => {
                        hideTypingIndicator();
                        reasoningContent = '';
                        currentReasoningDiv = null;
                    },
                    onReasoningContent: (delta) => {
                        if (reasoningContent === '') appendMessage('reasoning', delta);
                        else appendMessage('reasoning', delta, true);
                        reasoningContent += delta;
                    },
                    onReasoningMessageEnd: () => {
                        currentReasoningDiv = null;
                        reasoningContent = '';
                    },
                    onTextMessageStart: (messageId) => {
                        hideTypingIndicator();
                        currentMessageId = messageId;
                        assistantContent = '';
                        currentAssistantDiv = null;
                    },
                    onTextContent: (delta) => {
                        if (assistantContent === '') appendMessage('assistant', delta);
                        else appendMessage('assistant', delta, true);
                        assistantContent += delta;
                    },
                    onTextMessageEnd: (messageId) => {
                        if (assistantContent) {
                            messageHistory.push({ id: messageId, role: 'assistant', content: assistantContent });
                            lastAssistantContent = assistantContent;
                            checkForSlidesJson(assistantContent);
                        }
                        currentAssistantDiv = null;
                    },
                    onToolCallStart: (toolCallId, toolName) => {
                        hideTypingIndicator();
                        currentAssistantDiv = null;
                        appendMessage('tool', '🔧 执行: ' + toolName);
                    },
                    onError: (error) => {
                        hideTypingIndicator();
                        appendMessage('error', '错误: ' + error);
                    },
                    onRunFinished: () => {
                        hideTypingIndicator();
                        setStatus('就绪', '就绪');
                    }
                });
            } catch (error) {
                hideTypingIndicator();
                if (error.name === 'AbortError') {
                    if (assistantContent) {
                        messageHistory.push({ id: currentMessageId || 'msg-stopped-' + Date.now(), role: 'assistant', content: assistantContent + ' [已停止]' });
                    }
                    setStatus('就绪', '已停止');
                } else {
                    appendMessage('error', '错误: ' + error.message);
                    setStatus('error', '错误');
                }
            } finally {
                isRunning = false;
                sendBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'none';
                hideTypingIndicator();
                currentAssistantDiv = null;
                currentReasoningDiv = null;
                reasoningContent = '';
                if (statusText.textContent === '生成中...') setStatus('就绪', '就绪');
            }
        }

        function stopGeneration() {
            if (isRunning) { setStatus('停止中', '停止中...'); client.abort(); }
        }

        function newChat() {
            if (isRunning) client.abort();
            threadId = 'thread-' + Date.now();
            messageHistory = [];
            messages.querySelectorAll('.message').forEach(el => el.remove());
            emptyState.classList.remove('hidden');
            setStatus('就绪', '就绪');
            input.focus();
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        sendBtn.addEventListener('click', sendMessage);
        stopBtn.addEventListener('click', stopGeneration);
        newChatBtn.addEventListener('click', newChat);
        input.focus();

        // ── Slides.json Detection & Download ──

        var downloadBar = document.getElementById('download-bar');
        var downloadBtn = document.getElementById('download-btn');
        var downloadSubtitle = document.getElementById('download-bar-subtitle');
        var currentSlideData = null;

        function parseSlidesJson(text) {
            // 优先匹配 ```slides.json 代码块，也兼容 ```json
            var match = text.match(/```slides\.json\s*\n?([\s\S]*?)```/);
            if (!match) match = text.match(/```json\s*\n?([\s\S]*?\"slides\"\s*:[\s\S]*?)```/);
            if (!match) return null;
            try {
                var data = JSON.parse(match[1].trim());
                return data && data.slides ? data : null;
            } catch (e) {
                console.warn('Failed to parse slides.json:', e);
                return null;
            }
        }

        function checkForSlidesJson(text) {
            var data = parseSlidesJson(text);
            if (data) {
                // Auto-fill default theme if missing
                if (!data.theme) data.theme = {};
                if (!data.theme.colors) data.theme.colors = {};
                var defaults = { background:'0f172a', surface:'1e293b', primary:'3b82f6',
                    secondary:'06b6d4', accent:'f59e0b', text:'f8fafc',
                    textSecondary:'94a3b8', textMuted:'64748b', border:'334155' };
                Object.keys(defaults).forEach(function(k) {
                    if (!data.theme.colors[k]) data.theme.colors[k] = defaults[k];
                });
                currentSlideData = data;
                sessionStorage.setItem('slidesJson', JSON.stringify(data, null, 2));
                downloadSubtitle.textContent = data.title || 'PPT (' + data.slides.length + ' 页)';
                downloadBar.classList.remove('hidden');
            }
        }

        function clearJsonEditor() {
            currentSlideData = null;
            sessionStorage.removeItem('slidesJson');
            downloadBar.classList.add('hidden');
        }

        downloadBtn.addEventListener('click', function() {
            if (!currentSlideData) return;
            downloadBtn.disabled = true;
            downloadBtn.textContent = '生成中...';
            renderPptx(currentSlideData).then(function(blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = (currentSlideData.outputFile || 'presentation.pptx').replace(/^.*[/\\]/, '');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载 PPT';
            }).catch(function(err) {
                console.error('PPT generation failed:', err);
                downloadBtn.disabled = false;
                downloadBtn.textContent = '下载失败';
                setTimeout(function() {
                    downloadBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载 PPT';
                }, 3000);
            });
        });

        // ── PptxGenJS Elements-based Rendering ──

        function renderPptx(slideData) {
            var pres = new PptxGenJS();
            pres.defineLayout({ name: 'WIDE', width: 10, height: 5.625 });
            pres.layout = 'WIDE';

            // Auto-fill default theme if missing
            if (!slideData.theme) slideData.theme = {};
            if (!slideData.theme.colors) slideData.theme.colors = {};
            var defaults = { background:'0f172a', surface:'1e293b', primary:'3b82f6',
                secondary:'06b6d4', accent:'f59e0b', text:'f8fafc',
                textSecondary:'94a3b8', textMuted:'64748b', border:'334155' };
            Object.keys(defaults).forEach(function(k) {
                if (!slideData.theme.colors[k]) slideData.theme.colors[k] = defaults[k];
            });

            var c = slideData.theme.colors;
            var totalSlides = slideData.slides.length;

            // Theme color resolver: if a color value is a key in theme.colors, replace it
            function tc(color) {
                if (!color || typeof color !== 'string') return color;
                return c[color] || color;
            }

            // Apply theme color resolution to options recursively
            function applyTheme(opts) {
                if (!opts || typeof opts !== 'object') return opts;
                var o = JSON.parse(JSON.stringify(opts));
                delete o.letterSpacing;
                delete o.headerFill;
                delete o.fillColor;
                delete o.objectName;
                if (o.bullet && typeof o.bullet === 'object' && o.bullet.type === 'bullet') o.bullet = true;
                function forceStr(v) { return (v != null && typeof v === 'string') ? v : null; }
                if (o.color) o.color = tc(forceStr(o.color)) || o.color;
                if (o.valueColor) o.valueColor = tc(forceStr(o.valueColor)) || o.valueColor;
                if (o.fill && typeof o.fill === 'object' && o.fill.color) o.fill.color = tc(forceStr(o.fill.color)) || o.fill.color;
                if (o.line && o.line.color) o.line.color = tc(forceStr(o.line.color)) || o.line.color;
                if (o.shadow && o.shadow.color) o.shadow.color = tc(forceStr(o.shadow.color)) || o.shadow.color;
                if (o.border && o.border.color) o.border.color = tc(forceStr(o.border.color)) || o.border.color;
                if (o.chartColors && Array.isArray(o.chartColors)) {
                    o.chartColors = o.chartColors.map(function(c) { return tc(forceStr(c)) || c; });
                }
                return o;
            }

            function execElement(sl, el) {
                if (!el || !el.method) return;
                switch (el.method) {
                    case 'text':
                        sl.addText(el.text || '', applyTheme(el.options || {}));
                        break;
                    case 'shape':
                        sl.addShape(pres.ShapeType[el.shapeType || 'rect'], applyTheme(el.options || {}));
                        break;
                    case 'table':
                        sl.addTable(resolveTableCells(el.rows || []), applyTheme(el.options || {}));
                        break;
                    case 'chart':
                        sl.addChart(pres.ChartType[el.chartType || 'bar'], el.chartData || [], applyTheme(el.options || {}));
                        break;
                    case 'image':
                        sl.addImage(applyTheme(el.options || {}));
                        break;
                    case 'bg':
                        if (el.options && el.options.gradient && el.options.gradient.colorStops) {
                            var gs = el.options.gradient.colorStops.map(function(g) { return { color: tc(g.color) }; });
                            sl.background = { gradient: { type: el.options.gradient.type || 'linear', colorStops: gs } };
                        } else if (el.options && el.options.fill && el.options.fill.color) {
                            sl.background = { color: tc(el.options.fill.color) };
                        } else if (el.options && el.options.color) {
                            sl.background = { color: tc(el.options.color) };
                        }
                        break;
                }
            }

            // Resolve theme colors in table cell options (nested deep in rows)
            function resolveTableCells(rows) {
                if (!rows || !rows.length) return rows;
                var out = [];
                for (var ri = 0; ri < rows.length; ri++) {
                    var row = rows[ri];
                    if (!row || !row.length) { out.push(row); continue; }
                    var newRow = [];
                    for (var ci = 0; ci < row.length; ci++) {
                        var cell = row[ci];
                        if (cell && cell.options) {
                            newRow.push({ text: cell.text, options: applyTheme(cell.options) });
                        } else {
                            newRow.push(cell);
                        }
                    }
                    out.push(newRow);
                }
                return out;
            }

            slideData.slides.forEach(function(slide, idx) {
                var sl = pres.addSlide();

                (slide.elements || []).forEach(function(el) { execElement(sl, el); });

                sl.addText((idx+1) + '/' + totalSlides, { x:9.3, y:5.1, w:0.6, h:0.3, fontSize:8, color:c.textMuted || '64748b', align:'right', fontFace:'Arial', transparency:50 });
            });

            return pres.write({ outputType: 'blob' }).then(function(blob) { return blob; }, function(writeErr) {
                console.warn('PptxGenJS write failed, generating emergency text-only PPT...', writeErr);
                var pres2 = new PptxGenJS();
                pres2.defineLayout({ name: 'WIDE', width: 10, height: 5.625 });
                pres2.layout = 'WIDE';
                slideData.slides.forEach(function(s, idx) {
                    var sl2 = pres2.addSlide();
                    sl2.background = { color: c.background };
                    sl2.addText(slideData.title + ' - 第' + (idx+1) + '页', { x:0.5, y:0.3, w:9, h:0.6, fontSize:18, bold:true, color:c.text });
                    sl2.addText((idx+1) + '/' + totalSlides, { x:9.3, y:5.1, w:0.6, h:0.3, fontSize:8, color:c.textMuted, align:'right', transparency:50 });
                });
                return pres2.write({ outputType: 'blob' }).then(function(blob) { return blob; });
            });
        }

        // ── Clear editor on new chat ──
        newChatBtn.addEventListener('click', function() {
            clearJsonEditor();
            lastAssistantContent = '';
        });
    </script>
</body>
